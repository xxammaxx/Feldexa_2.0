# Issue #334 export journey — Maestro CLI gate evidence (PR #338 §10).
#
# Normative sources:
#   * `specs/001-scanned-form-workflow/contracts/editor-interactions.md` §10 —
#     export action, pre-export sheet, progress with cancel, preview with
#     „Schließen“;
#   * `specs/001-scanned-form-workflow/contracts/editor-interactions.md` §7 —
#     the review action „Übernehmen“ and the field overlay that announces the
#     confirmed field state after a reload;
#   * `reports/release/EMULATOR-PRECHECK.md` — the emulator baseline this flow
#     reproduces (import → analysis → autosave → review → export).
#
# The flow drives the real user path: the app's own „PDF importieren“ action
# opens the system `ACTION_OPEN_DOCUMENT` picker, and the flow selects the
# synthetic fixture `sf-001.pdf` from `/sdcard/Download`. The debug-only
# `de.feldexa/test.import` hook is deliberately not used.
#
# The flow covers the full journey twice over the same document: confirm a
# suggestion, export, close the preview, leave the editor, reopen the stored
# document, re-assert the confirmed field state, and export again. The reopen
# leg (E4) is the part that proves the journey survives a reload; the second
# export is the part that proves a second artifact is produced from the
# reopened document.
#
# Which field the flow confirms is *named*, never positional. Earlier versions
# confirmed the queue's first row; issue #340 removed exactly that candidate
# (`s_p0_0001`, a 2,875 × 3,875 pt glyph interior in the header band that could
# not hold a value), so "first row" silently became a different field while the
# reopen assertion still expected the old one. The flow now brings the review
# row of the fixture-declared field „Familienname“ (`fixtures.dart`,
# `p0-familienname`, a real text field) into view and confirms that row only.
#
# Not covered, and deliberately not faked: a *filled* value. Before the reload
# the flow asserts the named field only through the undo/durability signals
# (`Rückgängig`, `Gespeichert um`) and the review row title; the confirmed,
# not yet filled field state ("Feld Familienname, Typ Text, Seite 1, leer,
# bestätigt") is asserted after the reload through the field overlay label.
# The `FLD-001` observation of the earlier version belonged to the
# glyph-interior candidate that #340 now filters out; filling a value and the
# field geometry of the remaining candidates are *not* judged here. A
# value-bearing leg is journaled as an open point in
# `reports/release/reviews/2026-11-25-worker-report-export-evidence.md`.
#
# Every app selector is a visible German app string or the localized tooltip of
# an app-bar action — never a coordinate. The SAF picker is a *system* surface
# and is addressed by its en-locale labels (`Show roots`, `Open from`,
# `Downloads`), so the flow is tied to an english system locale; on a German
# system the picker steps must be re-recorded. Every wait is an `extendedWaitUntil`
# with an explicit timeout; the flow contains no fixed `sleep`.
#
# Run from the directory that should receive the screenshots:
#   maestro --device emulator-5554 test <absolute>/export_journey.yaml
#
# The export leg was blocked until 2026-11-25: every export answered the
# content-free `EXP-002` sentence because pdfbox-android could not read its
# predefined CMaps from the APK assets (`CMapParser.getExternalCMap` threw an
# `IOException`, reported as the internal `PLT-001`). `MainActivity` now calls
# `PDFBoxResourceLoader.init` before any service is registered
# (`reports/release/reviews/2026-11-25-debug-report-export-failure.md`).
#
# Evidence note: the editor, the pre-export sheet, and the export route carry
# `FLAG_SECURE` (`contracts/platform-channel.md` §11 point 7), so every
# screenshot taken inside them is a black frame. Only `01-start` and
# `07-start-list-after-export` („Meine Dokumente“) have visual content; the
# editor and export legs are evidenced by the assertions below and by the
# hierarchy dumps of the runs.
appId: de.feldexa.app
---
- launchApp:
    # `clearState: true` starts at „Meine Dokumente“ without stored documents,
    # so the import is the only route into the editor and the run does not
    # depend on what an earlier run left behind.
    clearState: true
- extendedWaitUntil:
    visible: "Meine Dokumente"
    timeout: 60000
- takeScreenshot: 01-start
- tapOn: "PDF importieren"
# System document picker: open the roots drawer and select Downloads.
- extendedWaitUntil:
    visible: "Show roots"
    timeout: 30000
- tapOn: "Show roots"
# The drawer is a separate hierarchy; wait for its header before the item tap.
- extendedWaitUntil:
    visible: "Open from"
    timeout: 15000
- tapOn: "Downloads"
- extendedWaitUntil:
    visible: "sf-001.pdf"
    timeout: 15000
- tapOn: "sf-001.pdf"
# Editor: the two-page fixture is analysed, then the review panel appears.
- extendedWaitUntil:
    visible: "Seite 1 von 2, Analyse abgeschlossen"
    timeout: 180000
- takeScreenshot: 02-editor-analysis-complete
# The review panel of every unresolved suggestion carries one „Übernehmen“ row
# action; the panel header itself is a multi-line accessibility node.
- extendedWaitUntil:
    visible: "Übernehmen"
    timeout: 30000
# The queue is a nested, height-capped scrollable, so a screen-level scroll does
# not reach it. The single gesture is anchored at the first row's page meta — a
# visible target inside the list, no screen coordinates — and the wait below is
# the gate that it actually brought the named row into view.
- swipe:
    from:
      text: "Seite 1"
      index: 0
    direction: UP
- extendedWaitUntil:
    visible: "Familienname"
    timeout: 15000
# Confirm that named row only: the selector is the row's own „Übernehmen“, i.e.
# the action below its label, not the queue's first row.
- tapOn:
    text: "Übernehmen"
    below:
      text: "Familienname"
# Autosave of the confirmation: the review action is reversible, and the
# durability label carries the durable timestamp of the save.
- extendedWaitUntil:
    visible: "Rückgängig"
    timeout: 30000
- extendedWaitUntil:
    visible: ".*Gespeichert um .*"
    timeout: 60000
- takeScreenshot: 03-autosave-after-confirm
# Export action of the app bar (localized tooltip).
- tapOn: "PDF exportieren"
# Pre-export information (empty fields, unreviewed suggestions) does not block.
- extendedWaitUntil:
    visible: ".*sind noch nicht geprüft.*"
    timeout: 30000
- takeScreenshot: 04-pre-export-sheet
- tapOn:
    # Index 1 is the start button; index 0 is the sheet title of the same name.
    text: "PDF exportieren"
    index: 1
# Export progress and preview (`contracts/editor-interactions.md` §10 point 3).
# The progress surface is best-effort: a two-page fixture can finish before the
# first phase is painted, so its title is asserted `optional` and never gates
# the run. The preview is the real gate: the footer, the page count of the
# exported artifact, and the „Schließen“ action.
- assertVisible:
    text: "PDF wird erstellt"
    optional: true
- extendedWaitUntil:
    visible: "Vorschau der erzeugten PDF-Datei"
    timeout: 180000
- extendedWaitUntil:
    visible: "Seiten: 2"
    timeout: 30000
- takeScreenshot: 05-export-preview
- tapOn: "Schließen"
- extendedWaitUntil:
    visible: "PDF exportieren"
    timeout: 30000
- takeScreenshot: 06-after-preview-close
# Reopen leg (E4): leave the editor back to „Meine Dokumente“, open the same
# stored document again, and assert that the confirmed field state from the
# review action above is still there. The editor route is a plain
# `MaterialPageRoute`, so the system back action is the app's own way out; the
# start list re-reads the store when the editor returns
# (`start_screen.dart` `_openEditor`).
- back
- extendedWaitUntil:
    visible: "Meine Dokumente"
    timeout: 30000
- extendedWaitUntil:
    # The stored title is the file name without its extension (`import` module,
    # `titleFrom`), and the list row is one merged accessibility node with the
    # title, the last-edited date, and the stored status, hence the `(?s)`
    # dot-all pattern.
    visible: "(?s).*sf-001.*"
    timeout: 30000
- takeScreenshot: 07-start-list-after-export
- tapOn:
    text: "(?s).*sf-001.*"
# Same accessibility label as before the export: the row's label, the confirmed
# provenance and the (still empty) value survived the reload, and no unresolved
# proposal is shown in its place. The label is the page overlay's own
# announcement of that one named field, not a content dump.
- extendedWaitUntil:
    visible: "Feld Familienname, Typ Text, Seite 1, leer, bestätigt"
    timeout: 180000
- takeScreenshot: 08-reopened-document
# Second export of the reopened document: same app-bar action, same pre-export
# sheet (the fixture's remaining unresolved suggestions stay unreviewed), new
# artifact, same preview contract.
- tapOn: "PDF exportieren"
- extendedWaitUntil:
    visible: ".*sind noch nicht geprüft.*"
    timeout: 30000
- tapOn:
    text: "PDF exportieren"
    index: 1
- extendedWaitUntil:
    visible: "Vorschau der erzeugten PDF-Datei"
    timeout: 180000
- extendedWaitUntil:
    visible: "Seiten: 2"
    timeout: 30000
- takeScreenshot: 09-second-export-preview
- tapOn: "Schließen"
- extendedWaitUntil:
    visible: "PDF exportieren"
    timeout: 30000
- takeScreenshot: 10-after-second-preview-close
