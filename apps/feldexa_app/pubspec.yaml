name: feldexa_app
description: Feldexa 2.0 application for Android production and the SIMULATED Web development surface.
version: 0.1.0+1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0 <4.0.0"

# T003: exact versions approved by plan.md §Primary Dependencies / research.md
# D-19. Versions are exact (not ranges) so pubspec.lock and the review record
# stay reproducible. Any version change requires the D-19 review again.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Locale-aware formatting used by generated gen-l10n code (BSD-3-Clause).
  # T003 constraint C-T003-6: declare it directly because generated
  # app_localizations.dart imports it. 0.20.3 is the already-reviewed
  # transitive version, so this adds no new package to the lock graph.
  intl: 0.20.3
  # T023: explicit platform capability interfaces and descriptor vocabulary.
  # The app registries compose every adapter through these ports; UI and domain
  # code never import an adapter package or a platform plugin directly.
  feldexa_ports:
    path: ../../packages/feldexa_ports
  # Issue #217 Phase B1: the editor now consumes the canonical revision,
  # suggestion, and page value objects directly when it validates an analysis
  # result through `RevisionContent`. This is the same already-resolved path
  # dependency that the tests used; it is promoted from dev_dependencies so
  # `lib/` may import it without a `depend_on_referenced_packages` violation.
  feldexa_core:
    path: ../../packages/feldexa_core
  # Issue #334 export UI: the editor/export route builds the canonical plan and
  # consumes the plan/validation/artifact models directly. This is the
  # workspace path of the already-resolved `feldexa_export` package that
  # `feldexa_ports` consumes; no third-party dependency is added.
  feldexa_export:
    path: ../../packages/feldexa_export
  # Issue #217 Phase B1: the editor invokes the Phase A analysis use case and
  # consumes the T057 per-page envelope directly. No orchestrator, store, or
  # second runtime is added.
  feldexa_application:
    path: ../../packages/feldexa_application
  feldexa_recognition:
    path: ../../packages/feldexa_recognition
  # T027: the Android composition root imports the real thin clients only on
  # the `dart:io` branch; the Web build never resolves this package.
  feldexa_adapters_android:
    path: ../../packages/feldexa_adapters_android
  # State injection / observable providers (MIT).
  flutter_riverpod: 2.6.1
  # Web-addressable navigation (BSD-3-Clause).
  go_router: 16.3.0
  # PDFium page rendering on Android and Web (MIT; PDFium BSD-3-Clause).
  pdfrx: 2.12.0
  # Pure-Dart page-raster analysis (MIT).
  image: 4.12.0
  # SIMULATED Web export artifact only (Apache-2.0).
  pdf: 3.13.1
  # Android print preview (Apache-2.0).
  printing: 5.15.1
  # Android share sheet (BSD-3-Clause).
  share_plus: 12.0.2
  # T309: no Dart OCR plugin here. On-device Latin OCR is provided natively by
  # `com.google.mlkit:text-recognition:16.0.1` (android/app/build.gradle.kts)
  # through MlKitOcrService.kt; a wrapper plugin would add a second, unused
  # recognizer copy. The guard tools/repo/test_mlkit_dart_dependency_absent.py
  # keeps it out.

dev_dependencies:
  flutter_test:
    sdk: flutter
  # T027: real Dart -> MethodChannel -> native EncryptedStore acceptance on the
  # exclusively allocated Android emulator.
  integration_test:
    sdk: flutter
  # T047: the SIMULATED browser import journey runs the T028 Web adapters.
  # Test-only, so an Android build never resolves this package (T023 boundary).
  feldexa_adapters_simulated:
    path: ../../packages/feldexa_adapters_simulated
  crypto: 3.0.8

flutter:
  # T005: gen-l10n generates lib/l10n/app_localizations*.dart from the German
  # template ARB. The generated files are committed so a plain build does not
  # depend on a prior generation step.
  generate: true
  uses-material-design: true

  # T006: Noto Sans is the single bundled text font (plan §Architecture
  # Decisions 6; contracts/export-plan.md §2 uses family "NotoSans" and these
  # exact asset paths). The static Regular/Bold TTFs are pinned by SHA-256 in
  # assets/fonts/PROVENANCE.md and checked by tools/fonts/verify_fonts.py.
  # T007 derives metrics.json from these same bytes.
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700

  # The OFL text ships as an asset so the later third-party licence surface
  # (T003 C-T003-3) can expose the exact bundled licence. The licence UI is a
  # later task; T006 only guarantees the file and its availability.
  #
  # T007: metrics.json is the generated advance table consumed by
  # `feldexa_export` for deterministic layout and clip detection. It is
  # declared here so Dart reads it through rootBundle, not from a build path.
  assets:
    - assets/fonts/OFL.txt
    - assets/fonts/metrics.json
  # T009: synthetic development fixtures are intentionally NOT Flutter assets.
  # Pubspec assets are packaged into every Android build, including release.
  # The canonical generated files stay undeclared under assets/fixtures/ and
  # are mirrored to web/fixtures/ for the Flutter Web dev server and
  # `flutter build web` at `/fixtures/...`; Android import tests use
  # `adb push tools/corpus/synthetic/sf-*.pdf`. See
  # assets/fixtures/README.md and tools/corpus/synthetic/generate.dart.
