name: feldexa_application
description: Feldexa use cases, autosave coordination, and repository orchestration.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  # Canonical immutable document, suggestion, field, and revision value objects
  # consumed by the pure review commands (T065) and the Phase A recognition
  # composition (issue #217).
  feldexa_core:
    path: ../feldexa_core
  # Existing platform port interfaces and DTOs composed by the Phase A
  # recognition use case (issue #217); no new port is introduced.
  feldexa_ports:
    path: ../feldexa_ports
  # Existing T050-T057 recognition modules composed by the Phase A pipeline.
  feldexa_recognition:
    path: ../feldexa_recognition
  # SHA-256 for the template-version snapshot and derived-document identity
  # (`lib/src/templates/template_versions.dart`). Already in the reviewed lock
  # graph (3.0.8); this only declares the direct use.
  crypto: 3.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Test-only coverage of the canonical SIMULATED template/version store; the
  # package depends on core/export/ports only, so no cycle is introduced.
  feldexa_adapters_simulated:
    path: ../feldexa_adapters_simulated
