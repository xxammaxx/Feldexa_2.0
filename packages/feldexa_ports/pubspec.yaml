name: feldexa_ports
description: Feldexa capability interfaces, error taxonomy, and capability descriptors.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  # Canonical core model and geometry types consumed by port signatures and
  # port-local DTOs (T013). `feldexa_ports` must never be imported by core or
  # export; the dependency direction is one-way.
  feldexa_core:
    path: ../feldexa_core
  # Canonical export contract models consumed by `PdfExportPort` (T022).
  feldexa_export:
    path: ../feldexa_export

dev_dependencies:
  flutter_test:
    sdk: flutter
